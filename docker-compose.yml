version: '3.8'

services:
  # L1: 大脑 (Gemini Web API)
  gemini-backend:
    image: geminiweb2api:latest
    container_name: gemini-backend
    ports:
      - "8080:8080"
    volumes:
      - ./config/backend.json:/app/config.json
    restart: always

  # L2: 适配器 (智能网关)
  gemini-bridge:
    build: ./bridge
    container_name: gemini-bridge
    ports:
      - "18789:18789"
    environment:
      - GEMINI_BACKEND=http://gemini-backend:8080
    restart: always
    depends_on:
      - gemini-backend

  # L3: 统帅 (OpenClaw-Zero-Token)
  openclaw-zero-token:
    image: node:20-slim
    container_name: openclaw-zero-token
    working_dir: /app
    volumes:
      - ./openclaw-zero-token:/app # 挂载 openclaw-zero-token 核心源码
      - ./config/openclaw.json:/root/.openclaw/openclaw.json # 挂载特有配置
    command: ["node", "openclaw.mjs", "gateway", "run", "--bind", "lan", "--port", "18790", "--force"]
    ports:
      - "18790:18790"
    restart: always
    depends_on:
      - gemini-bridge
