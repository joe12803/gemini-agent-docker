version: '3.8'

services:
  # L1: 大脑 (需先准备好 config/backend.json)
  gemini-backend:
    image: xxxx/geminiweb2api:latest
    container_name: gemini-backend
    ports:
      - "8080:8080"
    volumes:
      - ./config/backend.json:/app/config.json
    restart: always

  # L2: 适配器 (已上传至 GitHub 镜像库)
  gemini-bridge:
    image: ghcr.io/joe12803/gemini-tool-bridge:latest
    container_name: gemini-bridge
    ports:
      - "18789:18789"
    environment:
      - GEMINI_BACKEND=http://gemini-backend:8080
    restart: always

  # L3: 统帅 (本地构建以支持自定义 Skills)
  openclaw-zero-token:
    build: ./openclaw-zero-token
    container_name: openclaw-zero-token
    volumes:
      - ./openclaw-zero-token:/app
      - ./config/openclaw.json:/root/.openclaw/openclaw.json
    ports:
      - "18790:18790"
    restart: always
