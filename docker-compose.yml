services:
  gemini-backend:
    image: joe1280/geminiweb2api:latest
    container_name: gemini-backend
    ports:
      - "8080:8080"
    volumes:
      - /opt/geminiweb2api/config.json:/app/config.json
    restart: always

  gemini-bridge:
    image: joe1280/gemini-tool-bridge:latest
    container_name: gemini-bridge
    ports:
      - "18789:18789"
    environment:
      - GEMINI_BACKEND=http://gemini-backend:8080
      - API_KEY=sk-123456
    depends_on:
      - gemini-backend
    restart: always

  openclaw-agent:
    image: joe1280/openclaw-zero-token:latest
    container_name: openclaw-agent
    ports:
      - "18790:18790"
    volumes:
      - ./openclaw-zero-token/openclaw.json:/app/openclaw.json
    environment:
      - PORT=18790
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--allow-unconfigured", "--token", "sk-123456", "--auth", "token", "--ws-log", "full"]
    depends_on:
      - gemini-bridge
    restart: always
